name: Pararius watch

on:
  workflow_dispatch:          # "Run workflow" button – use this for the test
    inputs:
      dry_run:
        description: "Only print what it sees (no push, no state)"
        type: boolean
        default: true
  # Uncomment to run automatically every 5 minutes (off-peak minutes to reduce GitHub's delays).
  # Note: GitHub's Actions terms frown on using Actions as an always-on service.
  # schedule:
  #   - cron: "3-58/5 * * * *"

permissions:
  contents: write             # to commit seen.json

concurrency:
  group: pararius-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Pararius
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEARCH_URLS: ${{ vars.SEARCH_URLS }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python pararius_watch.py --dry-run
          else
            python pararius_watch.py
          fi

      - name: Upload page if parsing failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-page
          path: debug_last_page.html
          if-no-files-found: ignore

      - name: Save seen listings
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "pararius-bot"
          git config user.email "pararius-bot@users.noreply.github.com"
          git add seen.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update seen listings" && git push)
